[project]
name = "sim2real"
version = "0.0.1"
dependencies = [
  "flax",
  "gymnasium",
  "h5py",
  "hydra-core==1.3.*",
  "hydra-ax-sweeper",
  "imageio[ffmpeg]",
  "matplotlib",
  "mujoco",
  "mujoco-mjx",
  "numpy",
  "omegaconf",
  "orbax-checkpoint",
  "optax",
  "pyyaml",
  "skrl @ git+https://github.com/jan1854/skrl.git@genan",
  "tensorboardX",
  "tqdm"
]
requires-python = ">=3.10,<3.11"
authors = [
  {name = "Jan Schneider", email = "Jan.Schneider@tuebingen.mpg.de"},
  {name = "Mridul Mahajan"},
]
description = "Code for sim2real learning for muscular robots using actuator networks."
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sim2real"]

[tool.setuptools.package-data]
sim2real=["assets"]